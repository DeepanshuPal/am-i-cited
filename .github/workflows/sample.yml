name: sample

on:
  schedule:
    # Weekly, Monday 04:17 UTC - buyers' answers drift, resample and retrend.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  models: read

# Serialize: never race the final git push on overlapping runs.
concurrency:
  group: sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Sample engines and aggregate
        # Engines sample only when their key secret exists; missing keys are
        # reported as awaiting_key on the board, never a failure.
        run: |
          python scripts/sample.py
          python scripts/aggregate.py
        env:
          # GitHub Models free tier: the built-in token samples gpt-4o-mini
          # with no user key at all.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}

      - name: Commit fresh data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          git diff --cached --quiet || git commit -m "chore: weekly LLM visibility sample"
          git pull --rebase origin main
          git push
